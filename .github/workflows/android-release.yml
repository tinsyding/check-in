name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump part'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Bump version
        id: bump
        env:
          BUMP_PART: ${{ inputs.bump }}
        run: |
          python3 - <<'EOF'
          import os, re
          path = 'app/build.gradle.kts'
          src = open(path, encoding='utf-8').read()
          part = os.environ.get('BUMP_PART') or 'patch'

          m_code = re.search(r'versionCode\s*=\s*(\d+)', src)
          m_name = re.search(r'versionName\s*=\s*"(\d+)\.(\d+)\.(\d+)"', src)
          assert m_code and m_name, 'versionCode/versionName not found in app/build.gradle.kts'

          code = int(m_code.group(1)) + 1
          major, minor, patch = map(int, m_name.groups())
          if part == 'major':
              major, minor, patch = major + 1, 0, 0
          elif part == 'minor':
              minor, patch = minor + 1, 0
          else:
              patch += 1
          name = f'{major}.{minor}.{patch}'

          src = src.replace(m_code.group(0), f'versionCode = {code}', 1)
          src = src.replace(m_name.group(0), f'versionName = "{name}"', 1)
          open(path, 'w', encoding='utf-8').write(src)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'version_code={code}\nversion_name={name}\n')
          print(f'versionCode={code} versionName={name}')
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Sign Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(ls "$SDK_ROOT/build-tools/"*/apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass:env KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass:env KEY_PASSWORD \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify app/build/outputs/apk/release/app-release-signed.apk

      - name: Rename Release APK
        run: |
          if [ -f app/build/outputs/apk/release/app-release-signed.apk ]; then
            cp app/build/outputs/apk/release/app-release-signed.apk "apk-release-v${{ steps.bump.outputs.version_name }}.apk"
            echo "Release APK signed and ready to install."
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "apk-release-v${{ steps.bump.outputs.version_name }}.apk"
            echo "::warning::No signing secrets configured, release APK is unsigned and cannot be installed."
          fi
          ls -lh *.apk app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "Bump version to v${{ steps.bump.outputs.version_name }} [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Create and push tag
        run: |
          git tag "v${{ steps.bump.outputs.version_name }}"
          git push origin "v${{ steps.bump.outputs.version_name }}"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-release-v${{ steps.bump.outputs.version_name }}
          path: |
            apk-release-v*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version_name }}
          name: v${{ steps.bump.outputs.version_name }}
          generate_release_notes: true
          files: |
            apk-release-v*.apk
            app/build/outputs/apk/debug/*.apk
